<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>송영MAP 관리자</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
*{box-sizing:border-box}
:root{
  --bg:#eef1f7; --bg-2:#e4e9f4; --panel:#fff; --ink:#12141a; --ink-2:#3c4350; --muted:#6f7885; --muted-2:#a2a9b5;
  --line:#e7eaf1; --line-2:#dbe0ea;
  --brand:#3358e0; --brand-dk:#2544ba; --brand-soft:#eef1fe;
  --ok:#0f9d6e; --ok-soft:#e4f7ee;
  --warn:#b7791f; --warn-soft:#fdf3df;
  --bad:#d1453d; --bad-soft:#fdecea;
  --shadow:0 1px 2px rgba(16,24,40,.04), 0 8px 24px -8px rgba(16,24,40,.10);
  --shadow-sm:0 1px 2px rgba(16,24,40,.06);
}
html{-webkit-text-size-adjust:100%}
body{margin:0;
  background:
    radial-gradient(900px 420px at 12% -8%, rgba(51,88,224,.10), transparent 60%),
    radial-gradient(700px 380px at 100% 0%, rgba(51,88,224,.06), transparent 55%),
    var(--bg);
  background-attachment:fixed;
  color:var(--ink);
  font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,system-ui,"Malgun Gothic",sans-serif;
  font-size:15px;line-height:1.55;word-break:keep-all}

.wrap{max-width:900px;margin:0 auto;padding:28px 20px 70px}

/* ----- 머리말 ----- */
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.brandmark{flex:none;width:38px;height:38px;border-radius:11px;overflow:hidden;
  display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px rgba(37,68,186,.28)}
.brandmark svg{display:block}
.topbar h1{margin:0;font-size:18px;font-weight:800;letter-spacing:-.02em;line-height:1.3}
.topbar .sub{margin:1px 0 0;font-size:12.5px;color:var(--muted)}
.topbar .spacer{flex:1}
a.back{font-size:12.5px;color:var(--muted);text-decoration:none;font-weight:600;
  padding:7px 12px;border-radius:8px;border:1px solid var(--line-2);background:var(--panel);
  transition:color .15s,border-color .15s}
a.back:hover{color:var(--brand);border-color:var(--brand)}

/* ----- 통계 카드 ----- */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 15px;box-shadow:var(--shadow-sm)}
.stat .n{font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.stat .l{margin-top:3px;font-size:11.5px;color:var(--muted);font-weight:600}
.stat.ok .n{color:var(--ok)}
.stat.warn .n{color:var(--warn)}
.stat.bad .n{color:var(--bad)}

/* ----- 카드 ----- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);
  padding:20px 20px 22px;margin-bottom:16px}
.card h2{font-size:14.5px;margin:0 0 14px;font-weight:800;display:flex;align-items:center;gap:7px;letter-spacing:-.01em}
.card h2 .dot{width:6px;height:6px;border-radius:50%;background:var(--brand)}
label{display:block;font-size:12px;color:var(--muted);margin:0 0 5px;font-weight:700;letter-spacing:-.01em}

input,select{width:100%;padding:10.5px 12px;border:1.5px solid var(--line-2);border-radius:10px;
  font:inherit;font-size:14px;background:#fff;color:var(--ink);transition:border-color .15s,box-shadow .15s}
input:focus,select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
input::placeholder{color:var(--muted-2)}

.row{display:flex;gap:10px}
.row>div{flex:1}

button{border:0;border-radius:10px;padding:10.5px 17px;font:inherit;font-size:13.5px;font-weight:800;
  cursor:pointer;background:var(--brand);color:#fff;letter-spacing:-.01em;
  transition:background .15s,transform .1s,box-shadow .15s;box-shadow:0 1px 2px rgba(37,68,186,.15)}
button:hover{background:var(--brand-dk)}
button:active{transform:translateY(1px)}
button:disabled{opacity:.5;cursor:default;transform:none}
button.ghost{background:none;color:var(--muted);font-weight:700;padding:6px 11px;box-shadow:none}
button.ghost:hover{background:var(--bad-soft);color:var(--bad)}
button.chip{background:var(--panel);color:var(--ink-2);font-weight:700;padding:7.5px 13px;font-size:12.5px;
  border:1.5px solid var(--line-2);box-shadow:none}
button.chip:hover{border-color:var(--brand);color:var(--brand);background:var(--brand-soft)}
button.chip.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
button.chip.primary:hover{background:var(--brand-dk);border-color:var(--brand-dk);color:#fff}
button.chip.small{padding:5px 10px;font-size:11px;border-radius:7px}
.quickrow{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}

.msg{font-size:12.5px;margin:11px 0 0;color:var(--muted);min-height:1em}
.msg.bad{color:var(--bad);font-weight:700}
.msg.ok{color:var(--ok);font-weight:700}

/* ----- 표 ----- */
.tablehead{display:flex;align-items:center;gap:10px;margin-bottom:2px}
.tablehead h2{flex:none;margin:0}
.search{flex:1;position:relative;max-width:220px;margin-left:auto}
.search input{padding-left:32px}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted-2)}
.tablewrap{overflow-x:auto;margin:0 -2px}
table{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:8px;min-width:520px}
th,td{text-align:left;padding:11px 8px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
th{color:var(--muted);font-weight:700;font-size:11.5px;text-transform:uppercase;letter-spacing:.02em;
  cursor:pointer;user-select:none}
th:hover{color:var(--ink-2)}
th .arrow{opacity:.4;font-size:10px;margin-left:2px}
tbody tr{transition:background .12s}
tbody tr:hover{background:var(--brand-soft)}
tbody tr:last-child td{border-bottom:0}
.email{display:flex;align-items:center;gap:9px;white-space:nowrap}
.avatar{flex:none;width:26px;height:26px;border-radius:8px;background:var(--brand-soft);color:var(--brand-dk);
  font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;letter-spacing:0}
.emailtxt{overflow:hidden;text-overflow:ellipsis}
.muted-cell{color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:5px;justify-content:flex-end}
.tag{display:inline-flex;align-items:center;gap:5px;padding:3px 9px 3px 7px;border-radius:99px;font-size:11px;font-weight:700}
.tag::before{content:"";width:6px;height:6px;border-radius:50%}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.ok::before{background:var(--ok)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.warn::before{background:var(--warn)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.tag.bad::before{background:var(--bad)}
.dleft{display:block;margin-top:2px;font-size:10.5px;color:var(--muted-2);font-weight:600}
.empty{color:var(--muted);font-size:13px;padding:26px 0;text-align:center}

.note{margin:0 0 22px;font-size:12px;color:var(--muted-2);text-align:center}

#gate{position:fixed;inset:0;z-index:99;
  background:radial-gradient(900px 420px at 50% -10%, rgba(51,88,224,.14), transparent 60%), var(--bg);
  display:flex;align-items:center;justify-content:center;padding:20px}
#gate .card{width:100%;max-width:340px;text-align:center}
#gate .brandmark{margin:0 auto 14px}
#gate h2{font-size:17px;margin:0 0 4px;font-weight:800}
#gate .hint{margin:0 0 16px;font-size:12.5px;color:var(--muted)}

@media (max-width:640px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .row{flex-direction:column;gap:14px}
  .tablehead{flex-wrap:wrap}
  .search{max-width:none;margin-left:0;width:100%}

  /* 좁은 화면에서는 표 대신 사람마다 카드로 쌓는다(가로 스크롤 없이 다 보이게) */
  .tablewrap{overflow:visible;margin:0}
  table{min-width:0;margin-top:10px}
  thead{display:none}
  tbody tr{display:block;border:1px solid var(--line);border-radius:13px;
    padding:13px 14px 11px;margin-bottom:9px;background:var(--panel)}
  tbody tr:hover{background:var(--panel)}
  td{display:block;white-space:normal;padding:0;border-bottom:0}
  td:first-child{padding-bottom:10px}
  td:nth-child(n+2){display:flex;justify-content:space-between;align-items:center;
    padding:8px 0;border-top:1px solid var(--line)}
  td:nth-child(n+2)::before{content:attr(data-label);font-size:11px;color:var(--muted);font-weight:700}
  td:last-child{flex-direction:column;align-items:flex-start;gap:8px}
  td:last-child .actions{justify-content:flex-start;width:100%}
}
</style>
</head>
<body>

<div id="gate">
  <div class="card">
    <div class="brandmark" aria-hidden="true">
      <svg viewBox="0 0 64 64" width="34" height="34">
        <rect width="64" height="64" rx="13" fill="#2544ba"/>
        <circle cx="32" cy="15.5" r="8.8" fill="#e7ecff"/>
        <path d="M5.5 27.5c0-1.3.9-1.9 2.1-1.7 9.4 1.4 17.9 4.6 22.9 8.8v22.9c-5-4.2-13.5-7.3-22.9-8.7
                 -1.2-.2-2.1-.9-2.1-2.2z" fill="#e7ecff"/>
        <path d="M58.5 27.5c0-1.3-.9-1.9-2.1-1.7-9.4 1.4-17.9 4.6-22.9 8.8v22.9c5-4.2 13.5-7.3 22.9-8.7
                 1.2-.2 2.1-.9 2.1-2.2z" fill="#e7ecff"/>
        <rect x="25.6" y="31.5" width="4.6" height="28.5" rx="2.3" fill="#e7ecff"/>
        <rect x="33.8" y="31.5" width="4.6" height="28.5" rx="2.3" fill="#e7ecff"/>
      </svg>
    </div>
    <h2>관리자 로그인</h2>
    <p class="hint">송영MAP 이용자 명단을 관리합니다</p>
    <input type="password" id="pw" placeholder="비밀번호" autocomplete="current-password">
    <div style="margin-top:10px"><button type="button" id="pwGo" style="width:100%">들어가기</button></div>
    <p class="msg" id="pwMsg"></p>
  </div>
</div>

<div class="wrap" id="main" style="display:none">
  <div class="topbar">
    <div class="brandmark" aria-hidden="true">
      <svg viewBox="0 0 64 64" width="22" height="22">
        <rect width="64" height="64" rx="13" fill="#2544ba"/>
        <circle cx="32" cy="15.5" r="8.8" fill="#e7ecff"/>
        <path d="M5.5 27.5c0-1.3.9-1.9 2.1-1.7 9.4 1.4 17.9 4.6 22.9 8.8v22.9c-5-4.2-13.5-7.3-22.9-8.7
                 -1.2-.2-2.1-.9-2.1-2.2z" fill="#e7ecff"/>
        <path d="M58.5 27.5c0-1.3-.9-1.9-2.1-1.7-9.4 1.4-17.9 4.6-22.9 8.8v22.9c5-4.2 13.5-7.3 22.9-8.7
                 1.2-.2 2.1-.9 2.1-2.2z" fill="#e7ecff"/>
        <rect x="25.6" y="31.5" width="4.6" height="28.5" rx="2.3" fill="#e7ecff"/>
        <rect x="33.8" y="31.5" width="4.6" height="28.5" rx="2.3" fill="#e7ecff"/>
      </svg>
    </div>
    <div>
      <h1>송영MAP 이용자 관리</h1>
      <p class="sub">등록된 이메일만 송영MAP을 쓸 수 있습니다</p>
    </div>
    <div class="spacer"></div>
    <a class="back" href="/">서비스로 돌아가기</a>
  </div>

  <div class="stats" id="stats"></div>

  <div class="card">
    <h2><span class="dot"></span>이용자 등록 / 기간 연장</h2>
    <label>이메일</label>
    <input type="email" id="newEmail" placeholder="이름@기관.com" autocomplete="off">

    <div class="quickrow">
      <button type="button" class="chip primary" data-mode="renew" data-months="12">1년 갱신(오늘부터)</button>
      <button type="button" class="chip" data-mode="extend" data-months="1">+1개월 보너스</button>
      <button type="button" class="chip" data-mode="extend" data-months="2">+2개월 보너스</button>
      <button type="button" class="chip" data-mode="extend" data-months="3">+3개월 보너스</button>
      <button type="button" class="chip" data-mode="extend" data-months="6">+6개월 보너스</button>
    </div>

    <div class="row" style="margin-top:14px">
      <div>
        <label>직접 설정(개월)</label>
        <input type="number" id="customMonths" value="12" min="0.5" max="60" step="0.5">
      </div>
      <div>
        <label>방식</label>
        <select id="customMode">
          <option value="renew">오늘부터 재설정 (갱신)</option>
          <option value="extend">남은 기간에 더하기 (보너스)</option>
        </select>
      </div>
    </div>
    <div style="margin-top:12px"><button type="button" id="customGo">직접 설정 적용</button></div>
    <p class="msg" id="addMsg"></p>
  </div>

  <div class="card" id="userCard">
    <div class="tablehead">
      <h2><span class="dot"></span>등록된 이용자</h2>
      <div class="search">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="text" id="searchInput" placeholder="이메일 검색">
      </div>
    </div>
    <div id="listWrap"><p class="empty">불러오는 중…</p></div>
  </div>

  <p class="note">이용 기간이 만료돼도 등록 정보는 남습니다 · 완전히 빼려면 삭제를 누르세요</p>
</div>

<script>
(function(){
  var pw = null;
  var gate = document.getElementById('gate');
  var main = document.getElementById('main');
  var pwInput = document.getElementById('pw');
  var pwGo = document.getElementById('pwGo');
  var pwMsg = document.getElementById('pwMsg');
  var listWrap = document.getElementById('listWrap');
  var addMsg = document.getElementById('addMsg');
  var statsEl = document.getElementById('stats');
  var searchInput = document.getElementById('searchInput');

  var lastUsers = {};
  var sortKey = 'expiresAt', sortDir = 1; // 만료 임박 순으로 기본 정렬
  var WARN_DAYS = 14;

  function fmt(iso){
    var d = new Date(iso);
    if(isNaN(d.getTime())) return iso;
    return d.getFullYear() + '.' + (d.getMonth()+1) + '.' + d.getDate();
  }
  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
    });
  }
  function initials(email){
    return (String(email||'').trim()[0] || '?').toUpperCase();
  }
  function daysLeft(iso){
    if(!iso) return null;
    return Math.round((new Date(iso).getTime() - Date.now()) / 86400000);
  }
  function statusOf(iso){
    var d = daysLeft(iso);
    if(d === null) return 'bad';
    if(d < 0) return 'bad';
    if(d <= WARN_DAYS) return 'warn';
    return 'ok';
  }
  function statusLabel(iso){
    var d = daysLeft(iso);
    if(d === null) return '만료';
    if(d < 0) return '만료';
    if(d === 0) return '오늘 만료';
    if(d <= WARN_DAYS) return 'D-' + d;
    return '이용 가능';
  }

  function call(method, body){
    return fetch('/api/admin-users', {
      method: method,
      headers: Object.assign({'Content-Type':'application/json'}, pw ? {'X-Admin-Password': pw} : {}),
      body: body ? JSON.stringify(body) : undefined
    }).then(function(r){ return r.json(); });
  }

  function errText(d){
    var code = d && d.error;
    var base = code === 'bad_password'         ? '비밀번호가 틀렸습니다.'
             : code === 'admin_not_configured' ? '서버에 ADMIN_PASSWORD 환경변수가 없습니다.'
             : code === 'directory_unavailable'? '이용자 명단을 불러올 수 없습니다. Edge Config/Global Config 연결을 확인해 주세요.'
             : code === 'no_write_config'      ? '쓰기 설정이 안 돼 있습니다. VERCEL_API_TOKEN / EDGE_CONFIG_ID 를 확인해 주세요.'
             : code === 'bad_email'            ? '이메일 형식을 확인해 주세요.'
             : code === 'upstream'             ? '버셀에 쓰기를 요청했지만 거부됐습니다(VERCEL_API_TOKEN 또는 EDGE_CONFIG_ID를 확인해 주세요).'
             :                                    '문제가 생겼습니다(' + (code || '알 수 없음') + ').';
    var extra = '';
    if(d && d.status) extra += ' [HTTP ' + d.status + ']';
    if(d && d.detail) extra += ' ' + esc(String(d.detail));
    return base + extra;
  }

  function renderStats(users){
    var emails = Object.keys(users || {});
    var okN = 0, warnN = 0, badN = 0;
    emails.forEach(function(email){
      var s = statusOf(users[email].expiresAt);
      if(s === 'ok') okN++; else if(s === 'warn') warnN++; else badN++;
    });
    statsEl.innerHTML =
      '<div class="stat"><div class="n">' + emails.length + '</div><div class="l">전체 이용자</div></div>' +
      '<div class="stat ok"><div class="n">' + okN + '</div><div class="l">이용 가능</div></div>' +
      '<div class="stat warn"><div class="n">' + warnN + '</div><div class="l">만료 임박(' + WARN_DAYS + '일 이내)</div></div>' +
      '<div class="stat bad"><div class="n">' + badN + '</div><div class="l">만료됨</div></div>';
  }

  function renderList(users){
    lastUsers = users || {};
    renderStats(lastUsers);
    var q = searchInput.value.trim().toLowerCase();
    var emails = Object.keys(lastUsers).filter(function(e){ return !q || e.toLowerCase().indexOf(q) >= 0; });

    if(!Object.keys(lastUsers).length){
      listWrap.innerHTML = '<p class="empty">등록된 이용자가 없습니다. 위에서 이메일을 등록해 보세요.</p>';
      return;
    }
    if(!emails.length){
      listWrap.innerHTML = '<p class="empty">"' + esc(searchInput.value.trim()) + '"과(와) 일치하는 이용자가 없습니다.</p>';
      return;
    }

    emails.sort(function(a, b){
      var av = sortKey === 'email' ? a : (lastUsers[a][sortKey] || '');
      var bv = sortKey === 'email' ? b : (lastUsers[b][sortKey] || '');
      return av < bv ? -1*sortDir : av > bv ? 1*sortDir : 0;
    });

    function arrow(key){
      if(sortKey !== key) return '';
      return '<span class="arrow">' + (sortDir === 1 ? '▲' : '▼') + '</span>';
    }

    var html = '<div class="tablewrap"><table><thead><tr>' +
      '<th data-sort="email">이메일' + arrow('email') + '</th>' +
      '<th data-sort="addedAt">등록일' + arrow('addedAt') + '</th>' +
      '<th data-sort="expiresAt">만료일' + arrow('expiresAt') + '</th>' +
      '<th>상태</th><th></th></tr></thead><tbody>';
    emails.forEach(function(email){
      var e = lastUsers[email];
      var st = statusOf(e.expiresAt);
      var dl = daysLeft(e.expiresAt);
      html += '<tr><td><div class="email"><span class="avatar">' + esc(initials(email)) + '</span>' +
                '<span class="emailtxt">' + esc(email) + '</span></div></td>' +
              '<td class="muted-cell" data-label="등록일">' + (e.addedAt ? fmt(e.addedAt) : '—') + '</td>' +
              '<td class="muted-cell" data-label="만료일">' + (e.expiresAt ? fmt(e.expiresAt) : '—') + '</td>' +
              '<td data-label="상태"><span class="tag ' + st + '">' + statusLabel(e.expiresAt) + '</span>' +
                (dl !== null && dl < 0 ? '<span class="dleft">' + Math.abs(dl) + '일 지남</span>' : '') + '</td>' +
              '<td data-label="관리"><div class="actions">' +
                '<button type="button" class="chip small" data-ext="' + esc(email) + '" data-months="1" data-mode="extend">+1개월</button>' +
                '<button type="button" class="chip small" data-ext="' + esc(email) + '" data-months="3" data-mode="extend">+3개월</button>' +
                '<button type="button" class="chip small primary" data-ext="' + esc(email) + '" data-months="12" data-mode="renew">1년 갱신</button>' +
                '<button type="button" class="ghost" data-del="' + esc(email) + '">삭제</button>' +
              '</div></td></tr>';
    });
    html += '</tbody></table></div>';
    listWrap.innerHTML = html;
  }

  function refresh(){
    listWrap.innerHTML = '<p class="empty">불러오는 중…</p>';
    call('GET').then(function(d){
      if(d && d.ok) renderList(d.users);
      else listWrap.innerHTML = '<p class="empty" style="color:var(--bad)">' + errText(d) + '</p>';
    });
  }

  function tryPw(){
    var v = pwInput.value;
    if(!v) return;
    pw = v;
    pwGo.disabled = true;
    pwMsg.textContent = '확인 중…'; pwMsg.className = 'msg';
    call('GET').then(function(d){
      pwGo.disabled = false;
      if(d && d.ok){
        gate.style.display = 'none';
        main.style.display = 'block';
        renderList(d.users);
      } else {
        pw = null;
        pwMsg.textContent = errText(d);
        pwMsg.className = 'msg bad';
      }
    });
  }
  pwGo.addEventListener('click', tryPw);
  pwInput.addEventListener('keydown', function(e){ if(e.key === 'Enter') tryPw(); });

  function monthsLabel(months, mode){
    var m = months >= 12 && months % 12 === 0 ? (months/12) + '년' : months + '개월';
    return mode === 'extend' ? ('+' + m + ' 보너스 연장') : (m + ' 갱신(오늘부터)');
  }

  function applyToEmail(email, months, mode, statusEl, btn){
    if(!email){ statusEl.textContent = '이메일을 입력해 주세요.'; statusEl.className = 'msg bad'; return; }
    if(btn) btn.disabled = true;
    statusEl.textContent = monthsLabel(months, mode) + ' 처리 중…'; statusEl.className = 'msg';
    call('POST', {email:email, months:months, mode:mode}).then(function(d){
      if(btn) btn.disabled = false;
      if(d && d.ok){
        var exp = d.users[email] && d.users[email].expiresAt;
        statusEl.textContent = esc(email) + ' — ' + monthsLabel(months, mode) +
          ' 완료' + (exp ? ' (새 만료일 ' + fmt(exp) + ')' : '');
        statusEl.className = 'msg ok';
        renderList(d.users);
      } else {
        statusEl.textContent = errText(d);
        statusEl.className = 'msg bad';
      }
    });
  }

  // 등록 카드의 빠른 버튼들 (1년 갱신 / +N개월 보너스)
  document.querySelectorAll('.quickrow [data-mode]').forEach(function(btn){
    btn.addEventListener('click', function(){
      var email = document.getElementById('newEmail').value.trim();
      applyToEmail(email, parseFloat(btn.getAttribute('data-months')), btn.getAttribute('data-mode'), addMsg, btn);
    });
  });

  // 등록 카드의 직접 설정
  document.getElementById('customGo').addEventListener('click', function(){
    var email = document.getElementById('newEmail').value.trim();
    var months = parseFloat(document.getElementById('customMonths').value) || 12;
    var mode = document.getElementById('customMode').value;
    applyToEmail(email, months, mode, addMsg, this);
  });

  // 검색
  searchInput.addEventListener('input', function(){ renderList(lastUsers); });

  // 표 머리글 눌러서 정렬
  document.getElementById('userCard').addEventListener('click', function(e){
    var th = e.target.closest ? e.target.closest('[data-sort]') : null;
    if(!th) return;
    var key = th.getAttribute('data-sort');
    if(sortKey === key) sortDir *= -1; else { sortKey = key; sortDir = 1; }
    renderList(lastUsers);
  });

  // 등록된 이용자 표의 빠른 연장/갱신/삭제 버튼
  listWrap.addEventListener('click', function(e){
    var ext = e.target.closest ? e.target.closest('[data-ext]') : null;
    if(ext){
      var email = ext.getAttribute('data-ext');
      var months = parseFloat(ext.getAttribute('data-months'));
      var mode = ext.getAttribute('data-mode');
      applyToEmail(email, months, mode, addMsg, ext);
      return;
    }
    var b = e.target.closest ? e.target.closest('[data-del]') : null;
    if(!b) return;
    var delEmail = b.getAttribute('data-del');
    if(!confirm(delEmail + ' 을(를) 명단에서 빼시겠습니까?')) return;
    b.disabled = true;
    call('DELETE', {email:delEmail}).then(function(d){
      if(d && d.ok) renderList(d.users);
      else { alert(errText(d)); b.disabled = false; }
    });
  });
})();
</script>
</body>
</html>
